<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X GYM - No Pain, No Gain</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header -->
  <header>
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6.5 6.5l11 11M6.5 17.5l11-11M3 12h3M18 12h3M12 3v3M12 18v3" />
          </svg>
          <h1>X GYM</h1>
        </div>
        <nav>
          <button onclick="showHome()" class="nav-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            الرئيسية
          </button>
          <button onclick="showWorkouts()" class="nav-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6.5 6.5l11 11M6.5 17.5l11-11M3 12h3M18 12h3M12 3v3M12 18v3" />
            </svg>
            التمارين
          </button>
          <button onclick="showDiet()" class="nav-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="6" />
              <path d="M12 14c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" />
            </svg>
            الغذاء
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Home Page -->
    <div id="homePage" class="page active">
      <div class="welcome-section">
        <h2 class="main-title">WELCOME TO X GYM</h2>
        <p class="subtitle">حان وقت التحول 💪</p>

        <div class="home-cards">
          <div class="home-card workout-card" onclick="showWorkouts()">
            <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6.5 6.5l11 11M6.5 17.5l11-11M3 12h3M18 12h3M12 3v3M12 18v3" />
            </svg>
            <h3>التمارين</h3>
            <p>اختر برنامجك التدريبي</p>
          </div>

          <div class="home-card diet-card" onclick="showDiet()">
            <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="6" />
              <path d="M12 14c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" />
            </svg>
            <h3>الغذاء</h3>
            <p>اختر نظامك الغذائي</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Workouts Page -->
    <div id="workoutsPage" class="page">
      <h2 class="page-title">اختر برنامج التمرين</h2>
      <div id="workoutsList" class="cards-grid"></div>
      <div id="workoutDetail" class="detail-view"></div>
    </div>

    <!-- Diet Page -->
    <div id="dietPage" class="page">
      <h2 class="page-title">اختر نظامك الغذائي</h2>
      <div id="dietList" class="cards-grid"></div>
      <div id="dietDetail" class="detail-view"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>© 2024 X GYM - No Pain, No Gain 💪</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
